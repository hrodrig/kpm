# kpm sample configuration (SPEC draft v0.4 — Core normative; see SPECIFICATIONS.md).
# One process ↔ one cluster. Default config path: ./kpm.yaml (--config, kwd-style).
#
# Layers:
#   CORE     — sample → SQLite; backup / export (csv|tsv)  [implemented]
#   ADJACENT — recommend, capacity, tui                   [draft]
#   OPTIONAL — notifications, mcp (daemon), server charts [draft]

cluster:
  name: "example-cluster"
  environment: "dev"
  description: "Reference profile for kpm"

kube:
  context: ""

# client: who is sampling (bastion/host). Empty resolves via cascade:
# KPM_CLIENT_ID -> client.id -> hostname -> IPv4 -> MAC -> unknown.
# Tag every notification / sample line with client.id + cluster.name.
client:
  id: ""

store:
  path: "~/.local/share/kpm/metrics.db"
  # Keep enough history for stable percentiles / recommend (prefer ≥ window_days).
  # Production: >45 days recommended (often 60–90); lab default 14. Cost is disk.
  retention_days: 14

# sample.interval_seconds:
#   0  = one-shot sample → SQLite → exit
#   >0 = daemon: ALWAYS sample → SQLite each tick
#        + notifications if notifications.enabled
#        + MCP HTTP if mcp.enabled
#        + HTTP charts if server.enabled
sample:
  interval_seconds: 300

# scope: baseline selection for sample / capacity / tui
# scope:
#   namespaces: ["app"]
#   namespace_labels: ""
#   pod_labels: ""
#   node_labels: ""

recommend:
  window_days: 7
  percentile: 95
  min_samples: 24
  target_utilization: 0.70
  cpu_oversize_ratio: 0.35
  cpu_undersize_ratio: 0.85
  cpu_limit_oversize_ratio: 0.35
  cpu_limit_undersize_ratio: 0.85
  memory_oversize_ratio: 0.35
  memory_undersize_ratio: 0.85
  memory_limit_oversize_ratio: 0.35
  memory_limit_undersize_ratio: 0.85

# ADJACENT — interactive heatmap list (`kpm tui` / `kpm capacity --tui`)
tui:
  refresh_seconds: 5
  default_sort: cpu.ratio # name | cpu.util | cpu.request | cpu.ratio | mem.*
  baseline: request       # request | limit
  # Explicit watch list (namespace/name). Empty = all pods matching scope.
  # pods:
  #   - "app/frontend-0"
  #   - "app/api-0"
  # pod_labels: "kpm.watch=true"

# OPTIONAL — sustained threshold alerts (daemon only; interval_seconds > 0).
# If enabled and rules is empty/omitted → built-in defaults (CPU + mem util vs
# request at 80%) and a one-time log; see SPEC §6.0.
# Sinks are gghstats-school: slack | webhook (generic/discord/teams) | smtp.
# PagerDuty / n8n: use type webhook + body generic (no native pagerduty type).
# Anonymized payload examples: SPECIFICATIONS.md §6.4. Smoke: kpm notify-test.
# notifications:
#   enabled: true
#   rules: []   # empty → built-in 80% defaults + log
#   # rules:
#   #   - name: cpu-hot
#   #     namespaces: ["app"]
#   #     metric: cpu.util_vs_request
#   #     threshold_ratio: 0.90
#   #     hold_for_seconds: 600
#   #     clear_after_seconds: 600
#   #     repeat_seconds: 3600   # omit → 3600; set 0 for no repeat
#   #     notify_on_resolve: true
#   sinks:
#     - type: slack
#       webhook_url_env: KPM_SLACK_WEBHOOK
#     - type: webhook
#       url_env: KPM_DISCORD_WEBHOOK_URL
#       body: discord
#     - type: webhook
#       url_env: KPM_TEAMS_WEBHOOK_URL
#       body: teams
#     - type: webhook
#       url_env: KPM_PAGERDUTY_WEBHOOK_URL
#       body: generic
#     - type: smtp
#       host_env: KPM_SMTP_HOST
#       port_env: KPM_SMTP_PORT
#       user_env: KPM_SMTP_USER
#       password_env: KPM_SMTP_PASSWORD
#       from_env: KPM_SMTP_FROM
#       to_env: KPM_SMTP_TO
#       # use_tls: true   # 465 implicit TLS; omit/false → STARTTLS (587)

# OPTIONAL — read-only MCP (stdio via `kpm mcp`; HTTP when enabled in daemon).
# Daemon listen also serves:
#   ops:  /healthz /readyz /metrics  (no auth; exempt from allowlist/rate limit)
#   MCP:  /sse (SSE) and /mcp (streamable HTTP); bearer if token_env set
# Default bind is loopback (same idea as gghstats). Use 0.0.0.0 only behind a
# reverse proxy / in-cluster Service — then token_env is required.
# mcp:
#   enabled: true
#   listen: "127.0.0.1:9740"
#   token_env: KPM_MCP_TOKEN   # recommended; required if bind is non-loopback
#   # generate: export KPM_MCP_TOKEN="$(openssl rand -hex 32)"
#   trusted_proxies: ["10.0.0.0/8"]   # peers allowed to set XFF / X-Real-IP
#   allowlist_cidrs: ["10.0.0.0/8"]   # empty = off; bearer still bypasses IP check
#   rate_limit:
#     enabled: true                  # default true; ops paths exempt
#     requests: 120
#     period: 1m
#     burst: 20

# OPTIONAL — embedded HTTP charts (no SPA).
# server:
#   enabled: false
#   listen: "127.0.0.1:9741"
#   auth: false
#   # token_env: KPM_SERVER_TOKEN
